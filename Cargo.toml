[package]
name = "claude-here"
version = "0.6.0"
edition = "2024"
description = "Run Claude Code inside a project-scoped Docker sandbox with enforced git modes and network capture"
license = "MIT"
repository = "https://github.com/paxel/claude-here"
readme = "README.md"
keywords = ["claude", "docker", "sandbox", "ai", "cli"]
categories = ["command-line-utilities", "development-tools"]
default-run = "claude_here"

[lib]
name = "claude_here"
path = "src/lib.rs"

[[bin]]
name = "claude_here"
path = "src/bin/claude_here.rs"

[[bin]]
name = "claude_yolo"
path = "src/bin/claude_yolo.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env", "string"] }
clap_complete = "4.6.11"
comfy-table = "8.0.0"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
toml = "1.1.6"

[dev-dependencies]
tempfile = "3.27.0"

# The lint set of the standard (paxel/gates, configs/rust/lints.toml), plus pedantic.
[lints.rust]
# Forbidden rather than denied: the crate has no `unsafe` at all.
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
struct_excessive_bools = "allow"
missing_panics_doc = "allow"
# Shipped code may not panic: no unwrap, expect or panic, no unreachable, no indexing or
# slicing that can go out of bounds, no arithmetic that can overflow. CI runs clippy on the
# tests with these seven allowed (paxel/gates, actions/rust): they are how a test fails.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
arithmetic_side_effects = "deny"
todo = "deny"
unimplemented = "deny"
# No `dbg!`, and no `#[allow]`: a lint that must be silenced says so with an
# `#[expect(..., reason = "...")]`, which fails once the lint no longer fires.
dbg_macro = "deny"
allow_attributes = "deny"
