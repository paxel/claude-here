# Release on tag: pushing the tag `v0.6.1` produces everything.
#
#   gate        - paxel/gates release-gate.yml: no open alert or SonarQube Cloud finding that
#                 is not accepted, no known vulnerability, no licence outside the allowlist,
#                 and a CHANGELOG section for the version
#   test        - tag matches the crate version, then format, both clippy runs and every test
#                 on the tagged commit
#   integration - the Docker integration tests on the tagged commit
#   build       - per target a tar.gz with claude_here, claude_yolo, README.md and LICENSE,
#                 and its .sha256, for install.sh
#   installer   - install.sh as a release file of its own
#   provenance  - paxel/gates provenance.yml: a CycloneDX SBOM of the source, signed build
#                 provenance for every file and its Sigstore bundle as a file of its own
#   release     - GitHub Release, notes = the CHANGELOG section for the tag, with every file
#                 of the jobs before
#   homebrew    - renders the formula with the archives' checksums and pushes it to
#                 paxel/homebrew-tap as Formula/claude-here.rb (CHANNEL_PAT)
#
# One-time setup (repository secrets):
#   GATES_ALERTS_TOKEN - read access to the repository's alerts, for the release gate
#   CHANNEL_PAT        - push access to paxel/homebrew-tap
name: Release

on:
  push:
    tags: ["v*"]

# Least privilege: the job that writes the GitHub Release widens this itself.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  gate:
    needs: version
    uses: paxel/gates/.github/workflows/release-gate.yml@385f7ac316aef261a56e46bfc1e3553fa2efaccd # v1.4.0
    permissions:
      contents: read
      security-events: read
    with:
      version: ${{ needs.version.outputs.version }}
    secrets:
      alerts-token: ${{ secrets.GATES_ALERTS_TOKEN }}

  # The shared gate runs no tests. A tag can sit on any commit, so the tagged one is tested
  # here once more before anything is built from it (docs/adr/0011-move-to-gates.md).
  test:
    name: Tests on the tagged commit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Keep in sync with rust-toolchain.toml; toolchain bumps are deliberate, separate commits.
      - uses: dtolnay/rust-toolchain@9522411a9bce8484da960823fc2f46e52f981f71 # 1.100.0 branch
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Tag matches the crate version
        run: |
          ver=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          tag=${GITHUB_REF_NAME#v}
          [ "$ver" = "$tag" ] || { echo "tag v$tag != crate version $ver" >&2; exit 1; }
      - run: cargo fmt --check
      # The two clippy runs of the shared Rust gate: shipped code under the whole lint set,
      # tests with the lints allowed that are how a test fails.
      - name: Clippy on shipped code
        run: cargo clippy --locked --all-features -- -D warnings
      - name: Clippy on tests
        run: >-
          cargo clippy --locked --tests --benches --examples --all-features -- -D warnings
          -A clippy::unwrap_used -A clippy::expect_used -A clippy::panic -A clippy::indexing_slicing
          -A clippy::string_slice -A clippy::arithmetic_side_effects -A clippy::unreachable
      - run: cargo test --locked --all-features

  # The image chain is what the archives build on the user's machine; the tag proves it too.
  integration:
    name: Integration tests on the tagged commit
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Keep in sync with rust-toolchain.toml; toolchain bumps are deliberate, separate commits.
      - uses: dtolnay/rust-toolchain@9522411a9bce8484da960823fc2f46e52f981f71 # 1.100.0 branch
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --locked --test integration -- --ignored --test-threads=1 docker_toolchain ca_is

  build:
    name: Archive (${{ matrix.target }})
    needs: [gate, integration]
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Keep in sync with rust-toolchain.toml; toolchain bumps are deliberate, separate commits.
      - uses: dtolnay/rust-toolchain@9522411a9bce8484da960823fc2f46e52f981f71 # 1.100.0 branch
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Archive and checksum
        run: |
          set -eu
          name="claude_here-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$name" dist
          cp "target/${{ matrix.target }}/release/claude_here" "target/${{ matrix.target }}/release/claude_yolo" README.md LICENSE "$name/"
          tar -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
      # dist-*: the artifacts the provenance job collects.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  installer:
    needs: [gate, integration]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-installer
          path: install.sh

  # A CycloneDX SBOM of the source, signed build provenance for every file and the Sigstore
  # bundle as a file of its own, for verification without GitHub's API.
  provenance:
    needs: [build, installer]
    uses: paxel/gates/.github/workflows/provenance.yml@385f7ac316aef261a56e46bfc1e3553fa2efaccd # v1.4.0
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      name: claude_here
      tag: ${{ github.ref_name }}
      artifacts: dist-*

  release:
    name: GitHub Release
    needs: [version, provenance]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Every file of the build jobs, with the SBOM and the Sigstore bundle beside them.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - name: Release notes from the CHANGELOG section
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
            grab && (/^## \[/ || /^---/) { exit }
            grab { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; }
      - name: Create release (idempotent - a rerun updates instead of dying)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "claude_here $GITHUB_REF_NAME" --notes-file notes.md
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --target "$GITHUB_SHA" \
              --title "claude_here $GITHUB_REF_NAME" \
              --notes-file notes.md \
              dist/*
          fi

  # Only after the Release exists: the formula points at its assets.
  homebrew:
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Render the formula from the template
        run: |
          set -eu
          ver="${GITHUB_REF_NAME#v}"
          sha() { sha256sum "dist/claude_here-v${ver}-$1.tar.gz" | cut -d' ' -f1; }
          sed -e "s/{{VERSION}}/${ver}/g" \
              -e "s/{{SHA_MACOS_ARM64}}/$(sha aarch64-apple-darwin)/" \
              -e "s/{{SHA_MACOS_X86_64}}/$(sha x86_64-apple-darwin)/" \
              -e "s/{{SHA_LINUX_ARM64}}/$(sha aarch64-unknown-linux-musl)/" \
              -e "s/{{SHA_LINUX_X86_64}}/$(sha x86_64-unknown-linux-musl)/" \
              packaging/homebrew/claude-here.rb.tmpl > claude-here.rb
          ! grep -q '{{' claude-here.rb
      - name: Push to the tap (a rerun with nothing new pushes nothing)
        env:
          GH_TOKEN: ${{ secrets.CHANNEL_PAT }}
        run: |
          set -eu
          ver="${GITHUB_REF_NAME#v}"
          git config --global user.name "claude-here-release-bot"
          git config --global user.email "taum@tuta.io"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/paxel/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp claude-here.rb tap/Formula/claude-here.rb
          git -C tap add Formula/claude-here.rb
          if git -C tap diff --cached --quiet; then
            echo "Formula/claude-here.rb is already current"
          else
            git -C tap commit -m "claude-here ${ver}"
            git -C tap push
          fi
