name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tag matches the crate version
        run: |
          ver="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          tag="${GITHUB_REF_NAME#v}"
          [ "$ver" = "$tag" ] || { echo "tag v$tag != crate version $ver" >&2; exit 1; }
  build:
    needs: gate
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package
        run: |
          set -eu
          name="claude_here-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/claude_here" "target/${{ matrix.target }}/release/claude_yolo" README.md LICENSE "$name/"
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: claude_here-*.tar.gz*
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cp install.sh dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
  # Needs the CHANNEL_PAT repository secret: a PAT with push access to
  # paxel/homebrew-tap.
  homebrew:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: render the formula from the template
        run: |
          set -eu
          ver="${GITHUB_REF_NAME#v}"
          sha() { sha256sum "dist/claude_here-v${ver}-$1.tar.gz" | cut -d' ' -f1; }
          sed -e "s/{{VERSION}}/${ver}/g" \
              -e "s/{{SHA_MACOS_ARM64}}/$(sha aarch64-apple-darwin)/" \
              -e "s/{{SHA_MACOS_X86_64}}/$(sha x86_64-apple-darwin)/" \
              -e "s/{{SHA_LINUX_ARM64}}/$(sha aarch64-unknown-linux-musl)/" \
              -e "s/{{SHA_LINUX_X86_64}}/$(sha x86_64-unknown-linux-musl)/" \
              packaging/homebrew/claude-here.rb.tmpl > claude-here.rb
          ! grep -q '{{' claude-here.rb
      - name: push to the tap
        env:
          GH_TOKEN: ${{ secrets.CHANNEL_PAT }}
        run: |
          set -eu
          ver="${GITHUB_REF_NAME#v}"
          git config --global user.name "claude-here-release-bot"
          git config --global user.email "taum@tuta.io"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/paxel/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp claude-here.rb tap/Formula/claude-here.rb
          git -C tap add Formula/claude-here.rb
          git -C tap commit -m "claude-here ${ver}"
          git -C tap push
