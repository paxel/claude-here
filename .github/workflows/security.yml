# Fails only when a dependency has a known vulnerability (RustSec advisories). Runs weekly and
# on demand, because new advisories appear without any change in this repo.
# Warnings such as unmaintained or yanked packages are reported but never fail it.
name: Security

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    name: Vulnerable crates (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-audit
      # Warnings fail too: an unsound, unmaintained or yanked crate is a
      # finding, not a footnote (RUSTSEC-2026-0486 passed as a warning).
      - name: cargo audit
        run: cargo audit --deny warnings
