# Fuzzing of the parsers in fuzz/ (cargo-fuzz, libFuzzer). Every pull request
# and push to main runs each target for a minute; the weekly run goes longer,
# because a fuzzer finds more the longer it runs. A crash fails the job and
# its input is uploaded as an artifact; `cargo +nightly fuzz run <target>
# <file>` replays it.
name: Fuzz
on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:
concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [session_id, config_file, split_args, net_files]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # cargo-fuzz needs nightly for the sanitizer flags. The fuzz crate only;
      # the project itself stays on rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly branch
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      # install-action has no checksummed manifest for cargo-fuzz, so it is
      # built from crates.io at a fixed version with its own lockfile.
      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz ${{ matrix.target }}
        env:
          SECONDS_TO_RUN: ${{ github.event_name == 'schedule' && '900' || '60' }}
        run: cargo +nightly fuzz run "${{ matrix.target }}" -- -max_total_time="$SECONDS_TO_RUN"
      - name: Upload the crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 30
