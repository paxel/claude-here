name: Fuzz

# The fuzz targets in fuzz/ (cargo-fuzz, libFuzzer), weekly and by hand, from paxel/gates: the
# readers of what claude-here did not write itself, the session ids, config files, argument
# lists and network files. A crash fails the job; `cargo fuzz run <target> <file>` replays its
# input.
on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    uses: paxel/gates/.github/workflows/fuzz.yml@385f7ac316aef261a56e46bfc1e3553fa2efaccd # v1.4.0
    with:
      stack: rust
      # A fuzzer finds more the longer it runs: a quarter of an hour per target.
      seconds: 900
      targets: |
        session_id
        config_file
        split_args
        net_files
