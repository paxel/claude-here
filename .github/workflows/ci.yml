name: ci
on:
  push:
    branches: [main]
  pull_request:
# The token only reads the code: no job writes to the repository.
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Keep in sync with rust-toolchain.toml; toolchain bumps are deliberate, separate PRs.
      - uses: dtolnay/rust-toolchain@9522411a9bce8484da960823fc2f46e52f981f71 # 1.100.0 branch
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test
  # Known vulnerabilities and licences of every dependency, the image tools' pins included:
  # osv-scanner decided by gates' osv_gate.py. What is accepted stands in osv-scanner.toml
  # beside each lockfile.
  vulns:
    uses: paxel/gates/.github/workflows/vulns.yml@385f7ac316aef261a56e46bfc1e3553fa2efaccd # v1.4.0
  # The real-image checks: the base and toolchain layers build on the
  # runner's daemon, the entrypoint runs, rootless podman starts inside the
  # sandbox (ADR 0010) and a mounted CA lands in the bundle (ADR 0009).
  integration:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Keep in sync with rust-toolchain.toml; toolchain bumps are deliberate, separate PRs.
      - uses: dtolnay/rust-toolchain@9522411a9bce8484da960823fc2f46e52f981f71 # 1.100.0 branch
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: docker version && uname -r
      - run: sysctl kernel.apparmor_restrict_unprivileged_userns || true
      - run: cargo test --test integration -- --ignored --test-threads=1 docker_toolchain ca_is
