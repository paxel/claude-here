# SonarQube Cloud: https://sonarcloud.io/summary/new_code?id=paxel_claude-here
# Analysed by the sonar job of .github/workflows/ci.yml (paxel/gates sonar.yml) on pull requests
# and on summer; Automatic Analysis is off.
sonar.organization=paxel
sonar.projectKey=paxel_claude-here
sonar.projectName=claude-here

# Everything in the repository is a source except the tests; sources and tests may not
# overlap, so tests/ is excluded from the sources.
sonar.sources=.
sonar.tests=tests

# Built output, fuzz leftovers and local leftovers.
sonar.exclusions=tests/**,\
  target/**,\
  build/**,\
  fuzz/target/**,\
  fuzz/corpus/**,\
  fuzz/artifacts/**,\
  .claude_here/**
sonar.sourceEncoding=UTF-8

# Coverage: the shared Rust gate measures with tarpaulin and keeps coverage/rust.lcov, which
# the sonar job downloads.
sonar.rust.lcov.reportPaths=coverage/rust.lcov

# The fuzz targets run under cargo-fuzz, not under tarpaulin, so they have no
# line coverage to report.
sonar.coverage.exclusions=fuzz/**
