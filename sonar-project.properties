# SonarQube Cloud: https://sonarcloud.io/summary/new_code?id=paxel_claude-here
# Analysed by the sonar job of .github/workflows/quality.yml on pushes to main; Automatic
# Analysis is off in the project's settings.
sonar.organization=paxel
sonar.projectKey=paxel_claude-here
sonar.projectName=claude-here

# Everything in the repository is a source except the tests; sources and tests may not
# overlap, so tests/ is excluded from the sources.
sonar.sources=.
sonar.tests=tests

# Built output and local leftovers.
sonar.exclusions=tests/**,\
  target/**,\
  build/**,\
  .claude_here/**
sonar.sourceEncoding=UTF-8

# Clippy: the workflow writes this report with cargo clippy
# --message-format=json; the analyzer imports it as external issues.
sonar.rust.clippyReport.reportPaths=build/clippy-report.json

# Coverage: the tarpaulin run of rust-quality writes lcov.info, which the workflow
# downloads into build/.
sonar.rust.lcov.reportPaths=build/lcov.info
